[project]
name = "ha-gastpagina"
version = "0.4.1"
description = "Home Assistant integration: guest access to a whitelisted set of devices with a booking code"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "S"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.gastpagina"]
combine-as-imports = true
